[project]
name = "jobguard"
version = "0.1.0"
description = "JobGuard fake job detection service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "tensorflow-cpu==2.19.0; sys_platform == 'linux'",
    "tf-keras==2.19.0",
    "transformers==4.57.1",
    "sentence-transformers==5.2.2",
    "numpy==2.0.2",
    "pandas==2.2.2",
    "scikit-learn==1.6.1",
    "joblib==1.3.2",
    "Flask==3.1.2",
    "Flask-Caching==2.3.1",
    "werkzeug>=3.1.5",
    "gunicorn==23.0.0",
    "python-dotenv==1.1.1",
    "lime==0.2.0.1",
    "pyenchant",
    "wordfreq",
    "setuptools",
    "pygments",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
